# ============================================================
# micro-monorepo 核心配置：一仓 = 一个业务域
# packages 下每个目录都是一个「独立可部署子应用」或「域内公共包」
# ============================================================
packages:
  - 'packages/*'

# 统一依赖版本，避免各子应用 vue/vite 版本漂移导致运行时多实例
catalog:
  vue: ^3.5.13
  vue-router: ^4.5.0
  typescript: ~5.7.3
  vite: ^6.0.11
  '@vitejs/plugin-vue': ^5.2.1
  vue-tsc: ^2.2.0
